<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | ByteEgypt Admin</title>
  <link rel="icon" href="{{ url_for('static', filename='community-logo.png') }}" />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}" />
</head>
<body class="bg-slate-950 text-slate-100 font-sans">
  <div class="flex min-h-screen">
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 right-0 z-40 w-72 bg-slate-900/95 backdrop-blur border-l border-slate-800 flex flex-col transform translate-x-full lg:translate-x-0 transition-transform">
      <div class="p-6 border-b border-slate-800">
        <div class="flex items-center gap-3">
          <img src="{{ url_for('static', filename='community-logo.png') }}" class="w-12 h-12 rounded-xl object-cover" alt="logo" />
          <div>
            <h1 class="font-black text-lg leading-tight">ByteEgypt</h1>
            <p class="text-xs text-slate-400">لوحة التحكم</p>
          </div>
        </div>
      </div>
      <nav class="flex-1 overflow-y-auto p-4 space-y-1" id="nav">
        <button data-tab="overview" class="nav-btn active"><i class="fa-solid fa-gauge-high w-5"></i><span>نظرة عامة</span></button>
        <button data-tab="images" class="nav-btn"><i class="fa-solid fa-images w-5"></i><span>الصور 🎨</span></button>
        <button data-tab="settings" class="nav-btn"><i class="fa-solid fa-sliders w-5"></i><span>الإعدادات العامة</span></button>
        <div class="text-xs text-slate-500 px-3 pt-4 pb-1 font-bold">المحتوى</div>
        <button data-tab="hero" class="nav-btn"><i class="fa-solid fa-bullhorn w-5"></i><span>قسم Hero</span></button>
        <button data-tab="about" class="nav-btn"><i class="fa-solid fa-circle-info w-5"></i><span>عن المجتمع</span></button>
        <button data-tab="features" class="nav-btn"><i class="fa-solid fa-sparkles w-5"></i><span>المميزات</span></button>
        <button data-tab="future" class="nav-btn"><i class="fa-solid fa-rocket w-5"></i><span>الرؤية المستقبلية</span></button>
        <button data-tab="steps" class="nav-btn"><i class="fa-solid fa-list-ol w-5"></i><span>خطوات الانضمام</span></button>
        <button data-tab="faqs" class="nav-btn"><i class="fa-solid fa-circle-question w-5"></i><span>الأسئلة الشائعة</span></button>
        <button data-tab="roles" class="nav-btn"><i class="fa-solid fa-user-shield w-5"></i><span>الرتب</span></button>
        <button data-tab="stats" class="nav-btn"><i class="fa-solid fa-chart-simple w-5"></i><span>الإحصائيات</span></button>
        <button data-tab="safety" class="nav-btn"><i class="fa-solid fa-shield-halved w-5"></i><span>نقاط الأمان</span></button>
        <button data-tab="marquee" class="nav-btn"><i class="fa-solid fa-bars-staggered w-5"></i><span>شريط Marquee</span></button>
        <div class="text-xs text-slate-500 px-3 pt-4 pb-1 font-bold">الحساب</div>
        <button data-tab="account" class="nav-btn"><i class="fa-solid fa-user-gear w-5"></i><span>تغيير كلمة السر</span></button>
      </nav>
      <div class="p-4 border-t border-slate-800 space-y-2">
        <div class="flex items-center gap-2 px-3 py-2 text-sm">
          <i class="fa-solid fa-user-circle text-purple-400"></i>
          <span class="text-slate-300">{{ username }}</span>
        </div>
        <a href="/" target="_blank" class="flex items-center gap-2 px-3 py-2 text-sm rounded-lg hover:bg-slate-800 transition">
          <i class="fa-solid fa-eye text-blue-400 w-5"></i>
          <span>معاينة الموقع</span>
        </a>
        <form method="POST" action="/admin/logout">
          <button type="submit" class="w-full flex items-center gap-2 px-3 py-2 text-sm rounded-lg hover:bg-red-500/10 text-red-400 transition">
            <i class="fa-solid fa-arrow-right-from-bracket w-5"></i>
            <span>تسجيل الخروج</span>
          </button>
        </form>
        <p class="text-[10px] text-slate-600 text-center pt-2">egybyte by <span class="text-purple-400">Yousef Khames</span></p>
      </div>
    </aside>

    <!-- Backdrop -->
    <div id="backdrop" class="fixed inset-0 bg-black/60 z-30 lg:hidden hidden"></div>

    <!-- Main -->
    <main class="flex-1 min-w-0">
      <header class="sticky top-0 z-20 bg-slate-900/80 backdrop-blur border-b border-slate-800 px-4 lg:px-8 py-4 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="menuBtn" class="lg:hidden p-2 hover:bg-slate-800 rounded-lg">
            <i class="fa-solid fa-bars"></i>
          </button>
          <h2 id="pageTitle" class="text-xl font-black">نظرة عامة</h2>
        </div>
        <div id="toastHost"></div>
      </header>

      <div id="content" class="p-4 lg:p-8 max-w-6xl mx-auto">
        <div class="text-center py-20 text-slate-400">
          <i class="fa-solid fa-spinner fa-spin text-4xl"></i>
          <p class="mt-4">جاري التحميل...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div id="modal" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700 rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-800">
        <h3 id="modalTitle" class="font-bold text-lg">تعديل</h3>
        <button id="modalClose" class="p-2 hover:bg-slate-800 rounded-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto flex-1"></div>
      <div class="px-6 py-4 border-t border-slate-800 flex justify-end gap-2">
        <button id="modalCancel" class="px-4 py-2 rounded-lg hover:bg-slate-800 transition">إلغاء</button>
        <button id="modalSave" class="px-5 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 rounded-lg font-bold transition">
          <i class="fa-solid fa-floppy-disk ml-1"></i> حفظ
        </button>
      </div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='admin.js') }}"></script>
</body>
</html>
