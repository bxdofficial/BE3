<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Cosmic background gradient -->
    <radialGradient id="cosmic" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#1e2a5c"/>
      <stop offset="50%" stop-color="#0d1640"/>
      <stop offset="100%" stop-color="#05081f"/>
    </radialGradient>

    <!-- B letter gradient (purple) -->
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>

    <!-- E letter gradient (green) -->
    <linearGradient id="eGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <!-- Circuit line glow -->
    <filter id="circuitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Letter glow -->
    <filter id="letterGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Egypt outline glow -->
    <filter id="outlineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background square -->
  <rect width="400" height="400" rx="60" fill="url(#cosmic)"/>

  <!-- Stars -->
  <g fill="#fff" opacity="0.6">
    <circle cx="40" cy="50" r="0.8"/>
    <circle cx="80" cy="30" r="0.6"/>
    <circle cx="130" cy="60" r="1"/>
    <circle cx="200" cy="40" r="0.7"/>
    <circle cx="280" cy="55" r="0.9"/>
    <circle cx="340" cy="35" r="0.8"/>
    <circle cx="370" cy="80" r="0.6"/>
    <circle cx="60" cy="110" r="0.7"/>
    <circle cx="160" cy="120" r="0.5"/>
    <circle cx="240" cy="100" r="0.8"/>
    <circle cx="320" cy="140" r="0.6"/>
    <circle cx="30" cy="180" r="0.7"/>
    <circle cx="100" cy="200" r="0.5"/>
    <circle cx="220" cy="190" r="0.6"/>
    <circle cx="370" cy="200" r="0.8"/>
    <circle cx="50" cy="270" r="0.6"/>
    <circle cx="150" cy="290" r="0.7"/>
    <circle cx="260" cy="280" r="0.5"/>
    <circle cx="350" cy="300" r="0.8"/>
    <circle cx="80" cy="350" r="0.6"/>
    <circle cx="180" cy="370" r="0.7"/>
    <circle cx="290" cy="360" r="0.5"/>
    <circle cx="350" cy="380" r="0.6"/>
  </g>

  <!-- Circuit lines (gold/orange) around Egypt outline -->
  <g stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.7" filter="url(#circuitGlow)">
    <!-- Left side circuits -->
    <path d="M 20 180 L 60 180 L 60 160 L 90 160"/>
    <path d="M 20 220 L 80 220"/>
    <path d="M 20 260 L 50 260 L 50 240 L 75 240"/>
    <path d="M 30 130 L 70 130 L 70 110"/>
    <!-- Right side circuits -->
    <path d="M 380 180 L 340 180 L 340 160 L 310 160"/>
    <path d="M 380 220 L 320 220"/>
    <path d="M 380 260 L 350 260 L 350 240 L 325 240"/>
    <path d="M 370 130 L 330 130 L 330 110"/>
    <!-- Bottom -->
    <path d="M 100 380 L 100 350 L 130 350"/>
    <path d="M 280 380 L 280 350 L 250 350"/>
  </g>
  <!-- Circuit nodes -->
  <g fill="#fbbf24" filter="url(#circuitGlow)">
    <circle cx="60" cy="180" r="2.5"/>
    <circle cx="90" cy="160" r="2.5"/>
    <circle cx="80" cy="220" r="2.5"/>
    <circle cx="75" cy="240" r="2.5"/>
    <circle cx="70" cy="130" r="2.5"/>
    <circle cx="340" cy="180" r="2.5"/>
    <circle cx="310" cy="160" r="2.5"/>
    <circle cx="320" cy="220" r="2.5"/>
    <circle cx="325" cy="240" r="2.5"/>
    <circle cx="330" cy="130" r="2.5"/>
    <circle cx="130" cy="350" r="2.5"/>
    <circle cx="250" cy="350" r="2.5"/>
  </g>

  <!-- Egypt country outline (simplified) -->
  <g filter="url(#outlineGlow)">
    <path d="M 90 90
             L 310 85
             L 320 130
             L 315 170
             L 310 210
             L 305 250
             L 295 285
             L 270 310
             L 250 340
             L 230 360
             L 210 365
             L 180 360
             L 160 345
             L 145 320
             L 130 295
             L 115 265
             L 100 230
             L 92 195
             L 88 155
             L 90 120
             Z"
          fill="none"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linejoin="round"
          opacity="0.85"/>
  </g>

  <!-- Egyptian flag arc (red, white, green) -->
  <g transform="translate(200, 175)">
    <path d="M -80 0 A 80 80 0 0 1 80 0" fill="none" stroke="#ce1126" stroke-width="14" stroke-linecap="round"/>
    <path d="M -65 0 A 65 65 0 0 1 65 0" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
    <path d="M -50 0 A 50 50 0 0 1 50 0" fill="none" stroke="#22c55e" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Terminal prompt > -->
  <g filter="url(#letterGlow)">
    <path d="M 70 220 L 105 248 L 70 276"
          fill="none"
          stroke="#ffffff"
          stroke-width="14"
          stroke-linecap="round"
          stroke-linejoin="round"/>
    <!-- underscore _ -->
    <line x1="90" y1="295" x2="125" y2="295"
          stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- B letter -->
  <text x="138" y="298"
        font-family="Arial Black, Cairo, sans-serif"
        font-weight="900"
        font-size="135"
        fill="url(#bGrad)"
        filter="url(#letterGlow)">B</text>

  <!-- E letter -->
  <text x="232" y="298"
        font-family="Arial Black, Cairo, sans-serif"
        font-weight="900"
        font-size="135"
        fill="url(#eGrad)"
        filter="url(#letterGlow)">E</text>
</svg>
